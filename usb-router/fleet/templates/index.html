<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display network</title>
<style>
:root{--bg:#0e1116;--panel:#171b23;--panel2:#1e2430;--line:#2a3140;--text:#e8ecf2;--muted:#93a0b4;--accent:#4f8cff;--ok:#2fbf71;--bad:#f25f5c;font-size:15px}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f8;--panel:#fff;--panel2:#f0f3f8;--line:#dde3ec;--text:#10161f;--muted:#5a677a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;max-width:1400px;margin:0 auto}
h1{font-size:1.3rem;margin:0}main{padding:0 24px 24px;max-width:1400px;margin:0 auto}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:.8rem;padding:0 10px}
td{background:var(--panel);padding:10px;vertical-align:middle;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px}td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px}.dot.on{background:var(--ok)}
.input{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 9px;border-radius:8px;font:inherit;width:100%}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:7px 11px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn.d{color:var(--bad);border-color:var(--bad)}
.muted{color:var(--muted);font-size:.85rem}.sm{font-size:.8rem}.row{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.75rem;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
</style></head>
<body>
<header><h1>Display network</h1><span id="summary" class="muted"></span></header>
<main>
  <div class="bulk">
    <strong>Group update</strong>
    <input id="g-name" class="input" style="max-width:160px" placeholder="group">
    <input id="g-url" class="input" style="max-width:360px" placeholder="new content URL for the whole group">
    <button id="g-apply" class="btn p">Apply to group</button>
    <button id="g-reload" class="btn">Reload group</button>
    <span class="muted">Screens pick changes up on their next heartbeat (about a minute).</span>
  </div>
  <table>
    <thead><tr><th></th><th>Screen</th><th>Group</th><th>Content URL</th><th>Options</th><th>Showing / status</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="muted">A screen appears here after its first heartbeat. Blank fields mean "leave the screen's own setting alone".</p>
</main>
<div id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=async(p,o={})=>{const r=await fetch(p,{headers:{"Content-Type":"application/json"},...o,body:o.body?JSON.stringify(o.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);return d};
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3000)};
const ago=t=>t?`${Math.round(Date.now()/1000-t)} s ago`:"never";
let screens=[];
const render=()=>{
  const tb=$("#rows");tb.innerHTML="";
  const on=screens.filter(s=>s.online).length;$("#summary").textContent=`${screens.length} screens · ${on} online · ${screens.length-on} offline`;
  for(const s of screens){const r=s.report||{};const tr=document.createElement("tr");tr.dataset.id=s.device_id;
    tr.innerHTML=`<td><span class="dot ${s.online?"on":""}"></span></td>
    <td><input class="input f-name" value="${esc(s.name)}" placeholder="name"><div class="muted sm">${esc(s.device_id)} · ${esc(r.host||"")}</div></td>
    <td><input class="input f-group" value="${esc(s.group_name)}" placeholder="group"></td>
    <td><input class="input f-url" value="${esc(s.homepage)}" placeholder="${esc(r.homepage||"(screen's own)")}"></td>
    <td><div class="row"><select class="input f-rot" style="width:auto"><option value="">rotation: screen's own</option>${["normal","left","right","inverted"].map(v=>`<option ${s.rotation===v?"selected":""}>${v}</option>`).join("")}</select>
      <input class="input f-reload" type="number" min="0" style="width:90px" value="${s.reload_every??""}" placeholder="reload min"></div></td>
    <td class="sm"><div>${esc(r.current_url||"—")}</div><div class="muted">seen ${ago(s.last_seen)} · ${r.online?"internet ok":"no internet"} · ${r.uplink?esc(r.uplink.type+" "+(r.uplink.connection||"")):"no uplink"}${r.hotspot&&r.hotspot.active?" · hotspot":""}${s.pending_action?` · <span class="pill">pending: ${esc(s.pending_action)}</span>`:""}</div></td>
    <td><div class="row"><button class="btn p a-save">Save</button><button class="btn a-reload">Reload</button><button class="btn a-restart">Restart</button><button class="btn d a-reboot">Reboot</button><button class="btn d a-del" title="Remove from list">×</button></div></td>`;
    tb.appendChild(tr);}
};
const load=async()=>{try{screens=(await api("/api/screens")).screens;render()}catch(e){toast("Load failed: "+e.message)}};
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const tr=b.closest("tr");
  try{
    if(b.id==="g-apply"){const g=$("#g-name").value.trim(),u=$("#g-url").value.trim();if(!g||!u)return toast("Group and URL needed");const r=await api(`/api/groups/${encodeURIComponent(g)}`,{method:"POST",body:{homepage:u}});toast(`Updated ${r.updated.length} screens`);}
    else if(b.id==="g-reload"){const g=$("#g-name").value.trim();if(!g)return toast("Group needed");const r=await api(`/api/groups/${encodeURIComponent(g)}`,{method:"POST",body:{action:"reload"}});toast(`Reload queued for ${r.updated.length} screens`);}
    else if(tr){const id=tr.dataset.id,p=`/api/screens/${encodeURIComponent(id)}`;
      if(b.classList.contains("a-save")){await api(p,{method:"POST",body:{name:$(".f-name",tr).value,group_name:$(".f-group",tr).value,homepage:$(".f-url",tr).value,rotation:$(".f-rot",tr).value,reload_every:$(".f-reload",tr).value}});toast("Saved; applies on next heartbeat");}
      else if(b.classList.contains("a-reload")){await api(p,{method:"POST",body:{action:"reload"}});toast("Reload queued");}
      else if(b.classList.contains("a-restart")){await api(p,{method:"POST",body:{action:"restart-browser"}});toast("Browser restart queued");}
      else if(b.classList.contains("a-reboot")){if(confirm(`Reboot ${id}?`)){await api(p,{method:"POST",body:{action:"reboot"}});toast("Reboot queued");}}
      else if(b.classList.contains("a-del")){if(confirm(`Remove ${id} from the list? It reappears on its next heartbeat.`)){await api(p+"/delete",{method:"POST"});}}
    }
    await load();
  }catch(err){toast(err.message)}
});
load();setInterval(load,15000);
</script>
</body></html>
