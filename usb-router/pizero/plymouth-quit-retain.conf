# C&G #209 v8.2: the stock plymouth-quit clears the screen back to the console; keep the splash
# frame instead and only after the kiosk has been started, so the screen never shows text.
[Unit]
After=usb-router-splash.service usb-router-kiosk.service

[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
