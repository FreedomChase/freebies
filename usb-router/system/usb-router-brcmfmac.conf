# S&D #193: the Pi Zero W's Wi-Fi chip (brcmfmac, BCM43430) can do the WPA handshake in its own
# firmware (FWSUP, bit 13) and WPA3 SAE (bit 19). In access-point mode phones then fail to join
# ("Incorrect password") although the password is right. Disabled, wpa_supplicant does the
# handshake itself, as on any other Wi-Fi card. The screen's "Wi-Fi check" line shows
# "chip handshake off" when this file is in effect.
options brcmfmac feature_disable=0x82000
