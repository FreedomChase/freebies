[main]
# Use the built-in dnsmasq for the hotspot's DHCP/DNS (shared mode needs it).
dns=default
rc-manager=resolvconf

[device]
# Scanning with a random MAC confuses some captive portals; keep a stable one.
wifi.scan-rand-mac-address=no

[connectivity]
# NetworkManager's own captive-portal detection, used as a second opinion.
uri=http://connectivitycheck.gstatic.com/generate_204
interval=60
response=
