# C&G #281: the stick keeps its system journal (which holds the hotspot's DHCP lines: device MAC, the name it gives itself, address, time;
# never the sites guests visit) for at most 14 days, then drops it. Installed as
# /etc/systemd/journald.conf.d/usb-router.conf. A stick whose journal is in memory loses it at every restart sooner.
[Journal]
MaxRetentionSec=14day
