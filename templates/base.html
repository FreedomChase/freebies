<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Free tools · ORIONPATH{% endblock %}</title>
<meta name="description" content="{% block description %}Small free tools from ORIONPATH. No account, nothing to install.{% endblock %}">
<link rel="icon" href="{{ url_for('static', filename='brand/favicon-32.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/freebies.css') }}">
</head>
<body class="page-{{ active }}">
<a class="skip" href="#main">Skip to the tool</a>
<header class="top"><div class="wrap bar">
  <a class="brandmark" href="https://orionpath.io/freebies" aria-label="ORIONPATH free tools, all tools">
    <img src="{{ url_for('static', filename='brand/mark-96.png') }}" width="36" height="33" alt="">
    <span class="wordmark">ORIONPATH</span>
  </a>
  <nav class="toolnav" aria-label="Tools">
    <a href="/links"{% if active == 'links' %} aria-current="page"{% endif %}>Link shortener</a>
    <a href="/qr"{% if active == 'qr' %} aria-current="page"{% endif %}>QR codes</a>
    <a href="/password"{% if active == 'password' %} aria-current="page"{% endif %}>Passwords</a>
  </nav>
</div></header>
<main id="main" class="wrap">
  <section class="sec">
  {% block content %}{% endblock %}
  </section>
</main>
<footer class="foot"><div class="wrap">
  <p class="brandline"><span class="dot" aria-hidden="true"></span>ORIONPATH</p>
  <p>Free, no account, nothing to install. {% block footnote %}{% endblock %}</p>
  <p><a href="https://orionpath.io/freebies">All free tools</a> · <a href="https://orionpath.io/legal">Legal</a></p>
</div></footer>
{% block scripts %}{% endblock %}
</body>
</html>
