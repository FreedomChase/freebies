; Feedback box (C&G #213): ESP32-WROOM-32 DevKit (38 pin, CP2102).
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager@2.0.17
; Mozilla root CAs for HTTPS, generated at build time by tools/make_bundle.py (see README)
board_build.embed_files = data/cert/x509_crt_bundle.bin
